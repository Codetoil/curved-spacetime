name: Publish Archive (Jar)

on:
  release:
    types: [ published ]

jobs:
  publish-curved-spacetime-archive:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
      - name: Build
        # A release must not be blocked by verification — the artifacts are what is being
        # published, and checking them is the Check workflow's job. assemble is exactly artifact
        # production: `build` is `assemble` + `check`, and the distribution copies (jarCopyQuilt,
        # jarCopyClosedJar, nonJarCopy*) are attached to assemble, so the archives are fully
        # populated here. Excluding only `test` would leave the release exposed to any future
        # check task.
        run: ./gradlew assemble
      - run: git archive --format=tar.gz -o ./archive-quilt/source.tar.gz HEAD
      - run: git archive --format=tar.gz -o ./archive-closed-world-jar/source.tar.gz HEAD
      - run: zip -r ../curved-spacetime-quilt-variant-${{ github.ref_name }}.zip .
        working-directory: archive-quilt
      - run: zip -r ../curved-spacetime-closed-world-jar-variant-${{ github.ref_name }}.zip .
        working-directory: archive-closed-world-jar
      - name: Publish
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            ./curved-spacetime-quilt-variant-${{ github.ref_name }}.zip
            ./curved-spacetime-closed-world-jar-variant-${{ github.ref_name }}.zip