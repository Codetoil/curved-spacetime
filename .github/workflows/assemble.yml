name: Assemble

on: push

jobs:
  build-curved-spacetime:
    name: Build curved-spacetime
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Compile
        # This job compiles and assembles; verification belongs to the Check workflow, which runs
        # `check`. The distribution copies are attached to assemble, so the archive directories are
        # still fully populated here.
        run: ./gradlew assemble